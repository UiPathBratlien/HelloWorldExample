# Name of the workflow as it appears in the Actions tab
name: Hello World

# Specifies when the workflow should run
on:
  # Triggers the workflow on push events to any branch
  push:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Defines a series of jobs to run
jobs:
  # The ID for the job, in this case, 'my-job'
  my-job:
    # Specifies the type of virtual machine to run the job on
    runs-on: ubuntu-latest
    env:
      UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
      UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}

    # The steps for the job
    steps:
      # Step 1: Prints a message to the console
      - name: My first step
        run: echo "Hello World from Bratlien!"

      # Step 2: Prints a second message
      - name: My second step
        run: echo "This is my simple GitHub Action."
      
      # Step 3: Debug  
      - name: Debug secret presence
        run: |
          if [ -z "${{ secrets.UIPATH_CLIENT_ID }}" ]; then
            echo "❌ UIPATH_CLIENT_ID is empty"
          exit 1
          fi

          if [ -z "${{ secrets.UIPATH_CLIENT_SECRET }}" ]; then
            echo "❌ UIPATH_CLIENT_SECRET is empty"
            exit 1
          fi

          echo "✅ Secrets detected (lengths hidden for security)"
        
      #step 4: get_token
      - name: get_token  
        id: get_token
        run: |
          echo "client_id=${{ secrets.UIPATH_CLIENT_ID }}"
          echo "client_secret=${{ secrets.UIPATH_CLIENT_SECRET }}" 
          echo "Requesting Bearer Token .... "
          response=$(curl -s -X POST "https://staging.uipath.com/identity_/connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$UIPATH_CLIENT_ID" \
            --data-urlencode "client_secret=$UIPATH_CLIENT_SECRET" \
            --data-urlencode "scope=TM.Default")

          echo "Response: $response"
          token=$(echo "$response" | jq -r '.access_token')
          if [ "$token" = "null" ] || [ -z "$token" ]; then
           echo "Failed to get bearer token"
          exit 1
          fi
          echo "token=$token"

          echo "token=$token" >> $GITHUB_OUTPUT
          if [ -z "$token" ]; then
            echo "❌ Token is empty"
            exit 1
          fi
          echo "$GITHUB_OUTPUT"
          echo "End step 4"

      # Step 5 Execute Test Set from UiPath Test manager
      - name: Trigger_Test_Set_Execution
        run: |
          echo "Starting Test Set Exectuion " 
          echo "Authorization: Bearer ${{ steps.get_token.outputs.token }}"

          if [ -z "${{ steps.get_token.outputs.token }}" ]; then
            echo "❌ Token is empty"
            exit 1
          fi
          
          response=$(curl -v -s -X POST \
            "https://staging.uipath.com/uipathlabstestcloud/Playground/testmanager_/api/v2/5a434247-ff97-0000-7cd1-0b48e6294a04/testsets/c8b74974-29d3-0200-f250-0b48e6bbdcbc/startexecute?executionType=automated" \
            -H "accept: application/json" \
            -H "Authorization: Bearer ${{ steps.get_token.outputs.token }}")

          echo "Response: $response"
          
          # Extract execution ID
          execution_id=$(echo "$response" | jq -r '.id')
          if [ "$execution_id" = "null" ] || [ -z "$execution_id" ]; then
           echo "Failed to start execution"
          exit 1
          fi"
          
          # Set output for later steps
          echo "execution_id=$execution_id" >> $GITHUB_OUTPUT
          
      # Step 6 Wait for Test Execution to Complete
      - name: Wait for Test Execution to Complete
        run: |
          echo "⏳ Waiting for test execution to finish..."
          executionId="steps.Trigger_Test_Set_Execution.execution_id"
      
          for i in {1..30}; do
            status=$(curl -s -X GET \
              "https://staging.uipath.com/uipathlabstestcloud/Playground/testmanager_/api/v2/testexecutions/$executionId" \
              -H "Authorization: Bearer ${{ steps.get_token.outputs.token }}" \
              | jq -r '.status')
      
            echo "Current status: $status"
      
            if [ "$status" = "Completed" ]; then
              echo "✅ Test execution completed successfully!"
              break
            fi
      
            if [ "$status" = "Failed" ]; then
              echo "❌ Test execution failed!"
              exit 1
            fi
      
            sleep 10
          done
            

