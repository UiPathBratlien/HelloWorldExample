# Name of the workflow as it appears in the Actions tab dad name
name: Run UiPath TestSet

# Specifies when the workflow should run
on:
  # Triggers the workflow on push events to any branch
  push:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions needed so the workflow can publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

# Defines a series of jobs to run
jobs:
  # Job 1: Build the UiBank loan demo web app (from the app/ folder)
  Build_App:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the web app
        run: |
          # Copy the UiBank loan demo app from the app/ folder into dist/
          mkdir -p dist
          cp -r app/. dist/
          # Stamp the build number and commit into the page footer
          stamp="Build ${GITHUB_RUN_NUMBER} - commit ${GITHUB_SHA::7} - $(date -u +"%Y-%m-%d %H:%M UTC")"
          sed -i "s|UiBank demo copy</div>|${stamp}</div>|" dist/index.html
          grep -q "$stamp" dist/index.html || { echo "❌ Build stamp missing"; exit 1; }
          echo "✅ Built dist/index.html ($stamp)"

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Job 2: Deploy the app to GitHub Pages (main branch only)
  Deploy_App:
    needs: Build_App
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      app_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the app is live
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url ..."
          for i in {1..10}; do
            if curl -sf "$url" | grep -q "Loan"; then
              echo "✅ App is live at $url"
              exit 0
            fi
            echo "⏳ Not live yet, waiting 10s..."
            sleep 10
          done
          echo "❌ App did not come up at $url"
          exit 1

  # The ID for the job, in this case, 'my-job'
  # Job 3: Run the UiPath Test Set against the deployed app
  Run_UiPath_Tests:
    # Wait for the app to be built and deployed first.
    # On non-main branches Deploy_App is skipped, so tests still run after the build.
    needs: [Build_App, Deploy_App]
    if: ${{ !failure() && !cancelled() }}
    # Specifies the type of virtual machine to run the job on
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ needs.Deploy_App.outputs.app_url }}
      UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
      UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
      UIPATH_Token_URL: "https://staging.uipath.com/identity_/connect/token"
      #UIPATH_PROJECT_ID: "5a434247-ff97-0000-7cd1-0b48e6294a04"
      UIPATH_PROJECT_ID: "76d2f9f5-0fa9-0000-4e2e-0b49741de36f"
      #UIPATH_TESTSET_ID: "c8b74974-29d3-0200-f250-0b48e6bbdcbc"
      UIPATH_TESTSET_ID: "2e4b66d1-6025-0300-d75b-0b49757d6a7f"
      UIPATH_BASE_URL: "https://staging.uipath.com/uipathlabstestcloud/Playground/testmanager_/api/v2/"
    # The steps for the job
    steps:
      # Step 1: Prints a message to the console
      - name: My first step
        run: |
          echo "Hello World from UiPath_Bratlien! "
          echo "App under test: ${APP_URL:-not deployed on this branch}"

      # Step 2: Prints a second message
      - name: My second step
        run: echo "This is my simple GitHub Action that calls a Test Manager Test Set for execution waits for all test to execute before ending!"
      
      # Step 3: Debug  
      - name: Debug secret presence
        run: |
          if [ -z "${{ secrets.UIPATH_CLIENT_ID }}" ]; then
            echo "❌ UIPATH_CLIENT_ID is empty"
          exit 1
          fi

          if [ -z "${{ secrets.UIPATH_CLIENT_SECRET }}" ]; then
            echo "❌ UIPATH_CLIENT_SECRET is empty"
            exit 1
          fi

          echo "✅ Secrets detected (lengths hidden for security)"
        
      #step 4: get_token
      - name: get_token  
        id: get_token
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
        run: |
          echo "Requesting bearer token..."
          echo "Using $UIPATH_Token_URL"
          
          # Use --data-urlencode to avoid bash parsing issues with special chars
          response=$(curl -s -X POST "$UIPATH_Token_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$UIPATH_CLIENT_ID" \
            --data-urlencode "client_secret=$UIPATH_CLIENT_SECRET" \
            --data-urlencode "scope=TM.Default TM.TestExecutions TM.TestSets")
      
          echo "Response: $response"
          token=$(echo "$response" | jq -r '.access_token')
      
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "❌ Failed to get bearer token"
            exit 1
          fi
      
          echo "✅ Token retrieved"
          echo "token=$token" >> $GITHUB_OUTPUT

      # Step 5 Execute Test Set from UiPath Test manager
      - name: Trigger Test Set Execution
        id: Trigger_TS_Exec
        env: 
          UIPATH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          TOKEN="${{ steps.get_token.outputs.token }}"
          echo "Triggering Test Set Execution..."
          #echo "Using token: ${UIPATH_TOKEN:0:20}..." # shows only first 20 chars (for debug)
          echo "TOKEN LENGTH: ${#TOKEN}"
          
          response=$(curl -v -s -X POST \
            "${UIPATH_BASE_URL}${UIPATH_PROJECT_ID}/testsets/${UIPATH_TESTSET_ID}/startexecute?executionType=automated" \
            -H "accept: application/json" \
            -H "Authorization: Bearer $TOKEN")
          
          echo "Response: $response"
          
          execution_id=$(echo "$response" | jq -r '.id')
          if [ -z "$execution_id" ] || [ "$execution_id" = "null" ]; then
            echo "❌ Failed to start test set execution"
            exit 1
          fi
          
          echo "execution_id=$execution_id" >> $GITHUB_OUTPUT
          echo "execution_id=$execution_id"

      # Step 6 Wait For Test Execution to complete 
      - name: ⏱️ Wait for Test Execution to Complete
        env:
          TOKEN: ${{ steps.get_token.outputs.token }}
          EXECUTION_ID: ${{ steps.Trigger_TS_Exec.outputs.execution_id }}
        run: |
          echo "Waiting for test execution $EXECUTION_ID to complete..."

          # Max wait = 30 min (60 checks * 30s)
          for i in {1..60}; do
            status_response=$(curl -s -X GET \
             "${UIPATH_BASE_URL}${UIPATH_PROJECT_ID}/testexecutions/$EXECUTION_ID/withstats" \
              -H "accept: application/json" \
              -H "Authorization: Bearer $TOKEN")

            echo "$status_response" 
            status=$(echo "$status_response" | jq -r '.status')
            echo "Status check #$i → $status"

            if [[ "$status" == "Passed" || "$status" == "Failed" || "$status" == "Finished" || "$status" == "Cancelled" ]]; then
              echo "✅ Execution finished with status: $status"
              PassedTC=$(echo "$status_response" | jq -r '.passed')
              FailedTC=$(echo "$status_response" | jq -r '.failed')
              echo "✅ Execution has $PassedTC Passed Test Cases"
              echo "❌ Execution has $FailedTC Failed Test Cases"
              echo "final_status=$status" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "⏳ Still running... waiting 30s before next check"
            sleep 30
          done

          echo "❌ Timed out waiting for test execution"
          exit 1

        
